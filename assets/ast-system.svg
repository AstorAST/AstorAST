<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#333"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#333"/></linearGradient></defs>
<rect width="1200" height="190" rx="24" fill="#050505" stroke="#333"/>
<g font-family="monospace">
 <text x="40" y="42" fill="#666" font-size="11" letter-spacing="4">FINISH LINE / AST MARATHON</text>
 <!-- finish tape -->
 <rect x="40" y="70" width="1120" height="3" fill="#222"/>
 <rect x="40" y="70" width="180" height="3" fill="url(#g)"><animate attributeName="x" values="40;980;40" dur="3s" repeatCount="indefinite"/></rect>
 <!-- animated feet -->
 <g fill="#aaa">
  <circle cx="0" cy="0" r="4"><animateMotion dur="4s" repeatCount="indefinite" path="M50 110 H1150"/></circle>
  <circle cx="0" cy="0" r="4"><animateMotion dur="5.2s" repeatCount="indefinite" path="M50 130 H1150"/></circle>
  <circle cx="0" cy="0" r="4"><animateMotion dur="3.3s" repeatCount="indefinite" path="M50 150 H1150"/></circle>
 </g>
 <text x="40" y="116" fill="#fff" font-size="24">KEEP RUNNING</text>
 <text x="40" y="145" fill="#666" font-size="11">NO STATIC STATE / NO FINAL FRAME</text>
 <g transform="translate(1030 112)">
  <rect width="110" height="35" fill="none" stroke="#555"/>
  <text x="55" y="23" text-anchor="middle" fill="#fff" font-size="11">RUN ∞</text>
  <circle cx="95" cy="10" r="3" fill="#fff"><animate attributeName="opacity" values="0;1;0" dur=".8s" repeatCount="indefinite"/></circle>
 </g>
</g>
</svg>