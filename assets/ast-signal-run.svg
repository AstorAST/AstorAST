<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="260" rx="18" fill="#050505" stroke="#333"/>
<text x="40" y="42" fill="#777" font-family="monospace" font-size="12" letter-spacing="3">AST SIGNAL RUN / LIVE TRANSMISSION</text>
<text x="1160" y="42" text-anchor="end" fill="#555" font-family="monospace" font-size="12">DISTANCE 07.4 KM</text>

<path d="M55 170 C180 90 300 220 430 145 S680 95 790 170 S1010 220 1145 120" fill="none" stroke="#242424" stroke-width="12"/>
