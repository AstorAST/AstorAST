<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050505"/><stop offset=".5" stop-color="#151515"/><stop offset="1" stop-color="#050505"/></linearGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
  <clipPath id="c"><rect x="25" y="25" width="1150" height="470" rx="26"/></clipPath>
</defs>
<rect width="1200" height="520" fill="#000"/>
<rect x="25" y="25" width="1150" height="470" rx="26" fill="url(#bg)" stroke="#333"/>
<g clip-path="url(#c)">
  <rect x="25" y="25" width="1150" height="470" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-36 36" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- moving marathon lanes -->
  <g fill="none">
    <path d="M45 365 C250 300 350 430 550 360 S850 285 1155 350" stroke="#222" stroke-width="24"/>
    <path d="M45 365 C250 300 350 430 550 360 S850 285 1155 350" stroke="#777" stroke-width="2" stroke-dasharray="8 18">
      <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M45 395 C250 330 350 460 550 390 S850 315 1155 380" stroke="#181818" stroke-width="2" stroke-dasharray="2 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- runner -->
  <g filter="url(#glow)">
    <circle r="8" fill="#fff"/>
    <circle r="24" fill="none" stroke="#aaa" opacity=".5">
      <animate attributeName="r" values="12;34;12" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M45 365 C250 300 350 430 550 360 S850 285 1155 350"/>
  </g>

  <!-- moving light sweep -->
  <rect x="-350" y="55" width="330" height="2" fill="url(#beam)" opacity=".75">
    <animate attributeName="x" from="-350" to="1220" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <text x="65" y="75" fill="#777" font-family="monospace" font-size="12" letter-spacing="5">ASTORAST / CONTINUOUS RUN</text>
  <text x="65" y="160" fill="#fff" font-family="monospace" font-size="72" font-weight="700" letter-spacing="3">AstorAST</text>
  <text x="68" y="195" fill="#aaa" font-family="monospace" font-size="14" letter-spacing="3">WORLD BUILDING / SOFTWARE / SIMULATION / MEDIA</text>

  <g font-family="monospace">
    <text x="70" y="250" fill="#666" font-size="11">RUN</text>
    <text x="135" y="250" fill="#fff" font-size="11">ACTIVE</text>
    <text x="70" y="274" fill="#666" font-size="11">MODE</text>
    <text x="135" y="274" fill="#fff" font-size="11">LONG DISTANCE</text>
    <text x="70" y="298" fill="#666" font-size="11">SIGNAL</text>
    <text x="135" y="298" fill="#fff" font-size="11">ONLINE</text>
  </g>

  <!-- kinetic distance counter -->
  <g font-family="monospace" text-anchor="end">
    <text x="1125" y="90" fill="#555" font-size="11">DISTANCE</text>
    <text x="1125" y="126" fill="#fff" font-size="28">
      <tspan>0000</tspan>
      <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="1125" y="145" fill="#666" font-size="10">KM / STILL MOVING</text>
  </g>

  <g transform="translate(980 235)">
    <circle r="84" fill="none" stroke="#222" stroke-width="1"/>
    <circle r="84" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="3 17">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" fill="none" stroke="#444" stroke-dasharray="80 285">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <path d="M-104 0H104M0-104V104" stroke="#222"/>
    <circle r="5" fill="#fff"><animate attributeName="r" values="4;8;4" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="65" y="445" width="1070" height="1" fill="#333"/>
  <rect x="65" y="445" width="0" height="1" fill="#fff">
    <animate attributeName="width" values="0;1070;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="68" y="470" fill="#555" font-family="monospace" font-size="10">KEEP RUNNING / KEEP BUILDING</text>
  <text x="1132" y="470" text-anchor="end" fill="#555" font-family="monospace" font-size="10">AST // 2026</text>
</g>
</svg>