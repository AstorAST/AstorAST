<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#050505"/>
    <stop offset=".5" stop-color="#111"/>
    <stop offset="1" stop-color="#050505"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#555"/>
    <stop offset=".5" stop-color="#fff"/>
    <stop offset="1" stop-color="#555"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#fff" opacity=".025"/>
  </pattern>
  <clipPath id="clip"><rect x="28" y="28" width="1144" height="374" rx="22"/></clipPath>
</defs>

<rect width="1200" height="430" fill="#000"/>
<rect x="28" y="28" width="1144" height="374" rx="22" fill="url(#bg)" stroke="#3b3b3b"/>
<g clip-path="url(#clip)">
  <rect x="28" y="28" width="1144" height="374" fill="url(#scan)"/>

  <path d="M55 330 H1145" stroke="#333" stroke-width="2"/>
  <path d="M55 330 H1145" stroke="url(#line)" stroke-width="1" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="3s" repeatCount="indefinite"/>
  </path>

  <g opacity=".4">
    <path d="M80 92 H1120 M80 118 H1120 M80 144 H1120" stroke="#222"/>
    <path d="M80 270 H1120 M80 295 H1120" stroke="#222"/>
  </g>

  <text x="72" y="88" fill="#777" font-family="monospace" font-size="13" letter-spacing="4">AST NETWORK / PROFILE NODE</text>
  <text x="72" y="168" fill="#fff" font-family="monospace" font-size="70" font-weight="700" letter-spacing="2">ASTteam</text>
  <text x="75" y="201" fill="#8b8b8b" font-family="monospace" font-size="15" letter-spacing="3">WORLD BUILDING / SOFTWARE / SIMULATION / MEDIA</text>

  <g font-family="monospace" font-size="12" fill="#666">
    <text x="75" y="250">SIGNAL</text>
    <text x="75" y="273">NODE</text>
    <text x="75" y="296">STATUS</text>
  </g>
  <g font-family="monospace" font-size="12" fill="#aaa">
    <text x="145" y="250">AST-UNIVERSE</text>
    <text x="145" y="273">PROFILE-01</text>
    <text x="145" y="296">ONLINE</text>
  </g>

  <g transform="translate(870 215)">
    <circle cx="0" cy="0" r="76" fill="none" stroke="#252525"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="2 16">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#333" stroke-dasharray="90 240">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#fff" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M-95 0 H95 M0 -95 V95" stroke="#222"/>
  </g>

  <rect x="70" y="345" width="1060" height="1" fill="#333"/>
  <rect x="70" y="345" width="0" height="1" fill="#fff">
    <animate attributeName="width" values="0;1060;1060;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="75" y="375" fill="#555" font-family="monospace" font-size="11">CONNECTION ACTIVE</text>
  <text x="1118" y="375" text-anchor="end" fill="#777" font-family="monospace" font-size="11">AST // LOST SIGNAL</text>
</g>
</svg>